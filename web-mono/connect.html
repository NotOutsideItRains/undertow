<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Monochrome Connect</title>
<link rel="icon" href="/assets/monochrome_logo-CZupkp5H.svg" type="image/svg+xml">
<style>
  @font-face { font-family: Monocraft; src: url(/vendor/monocraft.woff2) format("woff2"); font-display: swap; }
  :root { --bg: #0b0b0c; --card: #161718; --line: #2b2d30; --fg: #f2f2f2; --muted: #a0a4a8; --accent: #ffb02e; --bad: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  main { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; }
  h1 { font: 400 1.5rem/1.2 Monocraft, system-ui, sans-serif; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f1011; color: var(--fg); font: inherit; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 10px 16px; }
  button.primary { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 700; width: 100%; margin-top: 18px; padding: 13px 16px; }
  button.quiet { color: var(--muted); font-size: .85rem; padding: 6px 10px; }
  #now { margin: 16px 0 4px; padding: 14px; border-radius: 12px; background: #0f1011; border: 1px solid var(--line); min-height: 64px; }
  #now .t { font-weight: 600; overflow-wrap: anywhere; }
  #now .s { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  #bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
  #msg { margin-top: 14px; font-size: .9rem; color: var(--muted); min-height: 1.3em; }
  #msg.bad { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Monochrome Connect</h1>
  <p>Turn this screen into a speaker. Press Start, then pick it in Monochrome with the speaker button.</p>

  <div id="setup">
    <label for="name">Name of this device</label>
    <input id="name" type="text" maxlength="40" autocomplete="off">
    <button id="go" class="primary" type="button">Start receiving</button>
  </div>

  <div id="live" hidden>
    <div id="now"><div class="t" id="title">Waiting for Monochrome…</div><div class="s" id="sub"></div><div id="bar"><i id="fill"></i></div></div>
    <label for="vol">Volume on this device</label>
    <input id="vol" type="range" min="0" max="100" step="1" value="60">
    <div class="row">
      <button id="stop" type="button">Stop receiving</button>
      <button id="forget" class="quiet" type="button">Remove this device</button>
    </div>
  </div>
  <div id="msg" role="status"></div>
  <audio id="a" preload="auto"></audio>
</main>
<script src="/connect.js" defer></script>
</body>
</html>
