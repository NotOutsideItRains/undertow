<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Join</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#dce9e5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#061820">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main class="join-wrap">
  <section class="card glass join-card">
    <div class="join-mark"><img src="/icon.svg?v=3" alt="" width="48" height="48"></div>
    <h1 id="title">Join</h1>
    <p class="muted" id="sub">Loading…</p>

    <div id="wall" hidden>
      <button class="btn discord" id="dc" type="button" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg> Continue with Discord</button>
      <div class="join-or" id="or" hidden><span>or use a username</span></div>
      <div class="seg" data-seg="mode" id="seg"><button type="button" data-v="new" class="on">Create account</button><button type="button" data-v="in">Sign in</button></div>
      <form id="fnew" autocomplete="on">
        <label class="field"><span>Name</span><input class="input" id="dn" maxlength="40" placeholder="Alex" autocomplete="given-name" required></label>
        <label class="field"><span>Username</span><input class="input" id="un" maxlength="24" autocapitalize="none" autocorrect="off" autocomplete="username" required><span class="hint" style="padding:0">3–24 characters: letters, numbers, . _ -</span></label>
        <label class="field"><span>Password</span><input class="input" id="pw" type="password" minlength="8" autocomplete="new-password" required><span class="hint" style="padding:0">At least 8 characters</span></label>
        <div class="err" id="e1" role="alert"></div>
        <button class="btn primary" id="b1">Create account</button>
      </form>
      <form id="fin" autocomplete="on" hidden>
        <label class="field"><span>Username</span><input class="input" id="un2" autocapitalize="none" autocorrect="off" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input class="input" id="pw2" type="password" autocomplete="current-password" required></label>
        <div class="err" id="e2" role="alert"></div>
        <button class="btn primary" id="b2">Sign in</button>
      </form>
    </div>

    <div id="done" hidden>
      <div><div class="hint" style="margin-bottom:6px">Source URL for BitChord</div><div class="urlbox"><code id="u1"></code><button class="btn sm" data-copy="u1">Copy</button></div></div>
      <div style="margin-top:14px"><div class="hint" style="margin-bottom:6px">Source URL for Eclipse</div><div class="urlbox"><code id="u2"></code><button class="btn sm" data-copy="u2">Copy</button></div></div>
      <p class="hint" style="margin-top:14px">This link is saved to your account. If you ever lose it, sign in and open <b>Links</b>. Keep it to yourself.</p>
      <a class="btn" href="/#/links" style="margin-top:6px">Open my account</a>
    </div>
  </section>
</main>
<script src="/join.js" defer></script>
</body>
</html>
