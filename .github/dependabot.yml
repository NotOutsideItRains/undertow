# Dependabot: weekly update PRs for the Python and Go dependencies.
# Node needs no entry: server.mjs uses only Node's built-in modules (no package.json).
# yt-dlp (and the pieces it needs: yt-dlp-ejs, deno) are left out on purpose. It breaks and
# gets fixed on YouTube's schedule, so it is updated by hand with tools/update-ytdlp.sh.
version: 2
updates:
  # the Discord bot
  - package-ecosystem: "pip"
    directory: "/discord-bot"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      - dependency-name: "yt-dlp"
      - dependency-name: "yt-dlp-ejs"
      - dependency-name: "deno"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # the pinned versions of the server's Python environment (tools/venv-requirements.txt)
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      - dependency-name: "yt-dlp"
      - dependency-name: "yt-dlp-ejs"
      - dependency-name: "deno"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # the Undertow RPC desktop app (no dependencies yet, so this stays quiet until some are added)
  - package-ecosystem: "gomod"
    directory: "/rpc-app"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
